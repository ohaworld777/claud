name: ks-image-relay
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download images
        run: |
          mkdir -p relay
          while read -r name url; do
            [ -z "$name" ] && continue
            echo "fetch $name"
            curl -sSL --retry 3 -o "relay/$name" "$url"
          done <<'EOF'
