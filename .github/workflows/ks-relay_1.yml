name: ks-image-relay
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download images
        run: |
          mkdir -p relay
          while read -r name url; do
            [ -z "$name" ] && continue
            echo "fetch $name"
            curl -sSL --retry 3 -o "relay/$name" "$url"
          done <<'EOF'
          charsheet.png https://pikaso.cdnpk.net/private/production/5213554166/render.png?token=exp=1787443200~hmac=7c712101608cb05bc5997f44c37d7e331985543522ea1fb66d63efe41c51a1f2
