          EOF
          ls -la relay/uav
      - name: commit images
        run: |
          git config user.name "ks-relay"
          git config user.email "relay@users.noreply.github.com"
          git add relay
          git commit -m "add relayed uav slide images" || echo "no changes"
          git push
