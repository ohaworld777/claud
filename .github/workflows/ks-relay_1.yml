name: ks-image-relay
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download images
        run: |
          mkdir -p relay/uav
          while read -r name url; do
            [ -z "$name" ] && continue
            echo "fetch $name"
            curl -sSL --retry 3 -o "relay/uav/$name" "$url"
          done <<'EOF'
          pilot.png https://pikaso.cdnpk.net/private/production/5224920556/render.png?token=exp=1787702400~hmac=ecb703ca41d885e54d545af3f8e5a22ed5d7ab16704fd90f2223ecf165571730
